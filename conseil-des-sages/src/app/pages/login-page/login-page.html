<div class="page">
  <main class="card glass glass--strong" aria-labelledby="auth-title">
    <div class="brand-mark" aria-hidden="true">
      <span class="orbit"></span>
      <span class="node node--blue"></span>
      <span class="node node--lilac"></span>
      <span class="node node--orange"></span>
      <span class="node node--pink"></span>
      <span class="node node--green"></span>
    </div>

    <header class="intro">
      <h1 id="auth-title">
        {{ mode() === 'connexion' ? 'Bon retour au conseil' : 'Rejoins le Conseil' }}
      </h1>
      <p>
        {{ mode() === 'connexion'
          ? 'Tes sages t’attendent. Reprends là où tu t’étais arrêté·e.'
          : 'Crée ton compte pour retrouver les sages.' }}
      </p>
    </header>

    <div class="tabs" role="tablist" aria-label="Mode d’authentification">
      <button
        type="button"
        role="tab"
        [attr.aria-selected]="mode() === 'connexion'"
        [class.active]="mode() === 'connexion'"
        (click)="setMode('connexion')"
      >
        Connexion
      </button>
      <button
        type="button"
        role="tab"
        [attr.aria-selected]="mode() === 'inscription'"
        [class.active]="mode() === 'inscription'"
        (click)="setMode('inscription')"
      >
        Inscription
      </button>
    </div>

    <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <label class="field" for="email">
        <span>Email</span>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="camille.moreau@mail.fr"
          autocomplete="email"
        >
      </label>

      <div class="password-group">
        <div class="field-heading">
          <label for="password">Mot de passe</label>
          <button class="forgot" type="button">Mot de passe oublié ?</button>
        </div>
        <div class="password-input">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••••"
            [autocomplete]="mode() === 'connexion' ? 'current-password' : 'new-password'"
          >
          <button
            class="visibility"
            type="button"
            [attr.aria-label]="showPassword() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
            (click)="togglePasswordVisibility()"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
        </div>
      </div>

      <button class="submit" type="submit">
        {{ mode() === 'connexion' ? 'Se connecter' : 'Créer mon compte' }}
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h14M13 6l6 6-6 6" />
        </svg>
      </button>
    </form>

    <p class="switch-mode">
      {{ mode() === 'connexion' ? 'Pas encore de compte ?' : 'Déjà un compte ?' }}
      <button
        class="signup-link"
        type="button"
        (click)="setMode(mode() === 'connexion' ? 'inscription' : 'connexion')"
      >
        {{ mode() === 'connexion' ? 'Inscris-toi' : 'Connecte-toi' }}
      </button>
    </p>
  </main>
</div>
