<div class="page">
  <main class="column">
    <h1 class="display-l title">Quelle décision t’attend ?</h1>

    @switch (store.state()) {
      @case ('error') {
        <div class="cds-glass cds-glass--strong notice" role="alert">
          <p class="body">Une erreur est survenue, on relance ?</p>
          <button type="button" class="cds-btn" (click)="store.load()">Réessayer</button>
        </div>
      }
      @default {
        <app-prompt-input
          [council]="store.council()"
          [starting]="starting()"
          [ready]="store.state() === 'ready'"
          (customize)="customizing.set(true)"
          (submitted)="start($event)"
        />
        @if (error()) {
          <p class="cds-error" role="alert">{{ error() }}</p>
        }
      }
    }
    @if (recent().length) {
      <app-recent-debates [debates]="recent()" />
    }
  </main>

  @if (stats(); as trends) {
    <app-trend-card [stats]="trends" />
  }
</div>

<app-modal
  heading="Personnaliser le conseil"
  subtitle="Choisis les voix qui débattront de ta décision."
  [wide]="true"
  [open]="customizing()"
  (closed)="customizing.set(false)"
>
  @if (customizing()) {
    <app-customize-council (done)="customizing.set(false)" />
  }
</app-modal>
