<header class="fixed md:w-10/12 inset-x-0 mx-auto my-5 z-40">

  <!-- Partie Ordinateur -->
  <div class="hidden md:flex items-center glass px-4 md:px-6 py-3 md:py-4">
    <div class="w-1/2">
      <img src="logo.png" alt="Conseil des Sages" class="h-8 md:h-12 items-center -my-2 md:-my-4 w-auto">
    </div>

    <nav aria-label="Navigation principale" class="w-1/2 flex justify-center gap-8">
      @for (link of links; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="text-pink-300" class="nav-link">{{ link.label }}</a>
      }
    </nav>
  </div>

  <!-- Partie Téléphone -->
  <div class="md:hidden flex justify-end px-5">
    <button type="button" z-button zSize="icon"
            [attr.data-open]="open()" [attr.aria-expanded]="open()"
            (click)="toggle()">
      <span class="relative block size-5">
        <svg lucideMenu class="icon icon--menu" aria-hidden="true"></svg>
        <svg lucideX class="icon icon--x" aria-hidden="true"></svg>
      </span>
    </button>
  </div>

</header>

<!-- Menu plein écran téléphone -->
<div id="mobile-menu" class="fullscreen md:hidden"
     role="dialog" aria-modal="true" aria-label="Menu"
     [attr.data-open]="open()" [attr.inert]="open() ? null : ''">
     
    
  <nav aria-label="Navigation mobile">
    <ul>
      @for (link of links; track link.path; let i = $index) {
        <li class="line" [style.--i]="i">
          <a [routerLink]="link.path" routerLinkActive="active" (click)="close()" class="link">
            <span class="line__inner">
              <small class="num">0{{ i + 1 }}</small>
              <span class="label">{{ link.label }}</span>
            </span>
          </a>
        </li>
      }
    </ul>
    <div class="line cta mt-8" [style.--i]="links.length">
        <div class="line__inner">
            <button type="button" z-button class="w-full" routerLink="/connexion" (click)="close()"> Connexion </button>
        </div>
    </div>
   
  </nav>
</div>
