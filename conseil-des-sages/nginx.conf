server {
    listen 80;
    root /usr/share/nginx/html;
    # Redirections relatives : nginx écoute sur le port 80 du conteneur, pas sur le port publié.
    absolute_redirect off;
    # Les cookies de localhost sont partagés entre tous les ports : ceux d'autres projets arrivent ici aussi.
    large_client_header_buffers 4 64k;

    location = / {
        return 302 /landing-page;
    }

    location /api/ {
        # Résolu à chaque requête : l'API peut être recréée sans redémarrer nginx.
        resolver 127.0.0.11 valid=10s;
        set $api http://backend:8080;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # L'API s'authentifie par jeton : les cookies ne lui servent pas, et Tomcat refuserait les plus gros.
        proxy_set_header Cookie "";
        # Flux du débat : chaque morceau part tout de suite, et un sage peut réfléchir longtemps.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Les pages pré-rendues, sinon l'application qui s'affiche dans le navigateur
    location / {
        try_files $uri $uri/index.html /index.csr.html;
    }

    location = /index.csr.html {
        add_header Cache-Control "no-cache";
    }
}
